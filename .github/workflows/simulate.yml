            any::readr
      - uses: actions/download-artifact@v4
        with:
          name: real-data-processed-pais
          path: data/processed
      - name: Bloque real por pais corregido (R=10000, grilla reducida n=10..250)
        run: Rscript R/02b_bloque_real_categorias_corregida.R ${{ matrix.dataset }} 10000 10,25,50,100,250 ${{ matrix.m }}
      - uses: actions/upload-artifact@v4
        with:
          name: bloque-real-pais-corregido-${{ matrix.dataset }}
          path: data/results/bloque_real_*_corregido*.csv

  bloque-real-categorias-sexo-corregido:
    # Mismo criterio que bloque-real-categorias-pais-corregido, para el
