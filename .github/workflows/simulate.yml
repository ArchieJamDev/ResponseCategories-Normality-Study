# Workflow de simulacion/submuestreo de este proyecto (ver notes/DESIGN.md).
# Mismo criterio que SSTN-Normality-Study: nada se corre localmente, toda
# corrida real (extraccion de datos reales, submuestreo, bateria de 11
# pruebas) pasa por GitHub Actions -- ver restriccion de integridad de
# investigacion en notes/DESIGN.md.

name: Bloque real de categorias

run-name: >-
  Bloque real:
  ${{ inputs.correr_extraccion && 'Extraccion de datos reales ' || '' }}${{ inputs.correr_bloque_real && 'Submuestreo real (6 datasets, k=4,5,6,7,8,9) ' || '' }}${{ inputs.correr_agregacion && 'Agregacion ' || '' }}${{ inputs.correr_calibracion_niveles && 'Calibracion de niveles (5 niveles x k=3..9) ' || '' }}${{ inputs.correr_consolidar_calibracion_niveles && 'Consolidar calibracion de niveles ' || '' }}${{ inputs.correr_simulacion_niveles && 'Simulacion de niveles (35 shards) ' || '' }}

on:
  workflow_dispatch:
    inputs:
      correr_extraccion:
        description: "Extrae los 6 datasets reales (RSE k=4, MACH-IV k=5, SPS-10 k=6, HEXACO k=7, AHS k=8, RWAS k=9) desde data/raw/ -- correr esto primero"
        type: boolean
        default: false
      correr_bloque_real:
        description: "Submuestreo m-out-of-N sobre los 6 datasets reales (R=10000, misma grilla de n que el bloque de niveles simulado, salvo AHS k=8 que usa grilla reducida por N mas bajo) -- requiere que correr_extraccion ya se haya corrido y su artifact este disponible"
        type: boolean
        default: false
      correr_agregacion:
        description: "Agrega los 6 CSV finales del bloque real en un consolidado"
        type: boolean
        default: false
      correr_calibracion_niveles:
        description: "Calibra lambda + umbrales (libre, no fijo) para 5 niveles de asimetria/curtosis x k=3..9 (ver R/03_calibrar_niveles.R y notes/DESIGN.md) -- correr esto antes de correr_consolidar_calibracion_niveles"
        type: boolean
        default: false
      correr_consolidar_calibracion_niveles:
        description: "Concatena los 5 CSV de calibracion de niveles en uno solo (data/results/calibracion_niveles.csv) -- requiere que correr_calibracion_niveles ya se haya corrido"
        type: boolean
        default: false
      correr_simulacion_niveles:
        description: "Simulacion completa (R=10000) de los 5 niveles x k=3..9 = 35 shards -- requiere que calibracion_niveles.csv ya este commiteado en el repo"
        type: boolean
        default: false
      correr_calibracion_normal:
        description: "Chequeo de error Tipo I: calibra el nivel de referencia 'normal' (asimetria=0, curtosis=0) x k=3..9 -- NO es uno de los 5 niveles de severidad, sirve para verificar si las 11 pruebas rechazan ~5% bajo el mecanismo generativo sin severidad real (ver notes/prompt_revision_julius.md, punto #2)"
        type: boolean
        default: false
      correr_simulacion_normal:
        description: "Simulacion completa (R=10000) del nivel 'normal' x k=3..9 = 7 shards -- requiere que calibracion_nivel_normal.csv ya este commiteado en el repo"
        type: boolean
        default: false
      correr_calibracion_umbral_nulo:
        description: "Paso 1 de la correccion por tamano (size-corrected power, punto #2 de la segunda revision externa): calcula el umbral empirico p05 por prueba/k/n bajo el nivel 'normal' x k=3..9 = 7 shards -- requiere que calibracion_nivel_normal.csv ya este commiteado"
        type: boolean
        default: false
      correr_simulacion_niveles_corregida:
        description: "Paso 2 de la correccion por tamano: repite los 5 niveles x k=3..9 = 35 shards con el umbral empirico en vez de p<.05 -- requiere que los 7 umbral_nulo_k*.csv ya esten commiteados"
        type: boolean
        default: false
      correr_bloque_real_corregido:
        description: "Paso 3 de la correccion por tamano: repite el submuestreo de los 6 instrumentos reales con el umbral empirico -- corre su propia extraccion fresca en el mismo despacho (needs: extract-real-data-corregido)"
        type: boolean
        default: false
      correr_extraccion_pais:
        description: "Chequeo de robustez: extrae y separa EE.UU. vs. resto del mundo para 5 de los 6 datasets reales (RSE, MACH-IV, HEXACO, SPS-10, RWAS; excluye AHS por ser 100% EE.UU.) -- ver R/01b_extract_real_subscales_pais.R"
        type: boolean
        default: false
      correr_bloque_real_pais:
        description: "Submuestreo m-out-of-N sobre los 10 archivos EE.UU./resto (grilla reducida n=10,25,50,100,250) -- requiere que correr_extraccion_pais ya se haya corrido en el mismo dispatch"
        type: boolean
        default: false
      correr_agregacion_pais:
        description: "Agrega los 10 CSV del chequeo por pais en un consolidado (data/results/consolidado_pais.csv) y calcula la brecha EE.UU. vs. resto"
        type: boolean
        default: false
      correr_extraccion_sexo:
        description: "Chequeo de robustez: extrae y separa hombres vs. mujeres para 5 de los 6 datasets reales (RSE, MACH-IV, SPS-10, RWAS, AHS; excluye HEXACO por no tener columna de sexo) -- ver R/01c_extract_real_subscales_sexo.R"
        type: boolean
        default: false
      correr_bloque_real_sexo:
        description: "Submuestreo m-out-of-N sobre los 10 archivos hombres/mujeres (grilla reducida n=10,25,50,100,250) -- requiere que correr_extraccion_sexo ya se haya corrido en el mismo dispatch"
        type: boolean
        default: false
      correr_agregacion_sexo:
        description: "Agrega los 10 CSV del chequeo por sexo en un consolidado (data/results/consolidado_sexo.csv) y calcula la brecha hombres vs. mujeres"
        type: boolean
        default: false
      correr_calibracion_umbral_nulo_m_instrumento:
        description: "Chequeo de robustez pedido en revision externa (notes/prompt_revision_julius_v3.md/v4.md): recalibra el umbral de referencia con el m nativo de MACH-IV (m=20,k=5), AHS (m=8,k=8) y RWAS (m=22,k=9) en vez del m=10 generico del bloque de niveles"
        type: boolean
        default: false
      correr_bloque_real_corregido_m_instrumento:
        description: "Repite el submuestreo corregido de MACH-IV/AHS/RWAS con su umbral m-especifico -- requiere correr_calibracion_umbral_nulo_m_instrumento en el mismo despacho (usa el artifact real-data-processed ya publicado de correr_extraccion)"
        type: boolean
        default: false
      correr_bloque_real_pais_corregido:
        description: "Exploratorio (no implica cambios al paper todavia): repite el chequeo de pais (EE.UU. vs. resto, grilla reducida n=10..250) con el umbral corregido (umbral_nulo_k<k>[_m<m>].csv, ya commiteados) en vez de potencia nominal -- requiere correr_extraccion_pais en el mismo despacho"
        type: boolean
        default: false
      correr_bloque_real_sexo_corregido:
        description: "Exploratorio (no implica cambios al paper todavia): repite el chequeo de sexo (hombres vs. mujeres, grilla reducida n=10..250) con el umbral corregido en vez de potencia nominal -- requiere correr_extraccion_sexo en el mismo despacho"
        type: boolean
        default: false

jobs:
  extract-real-data:
    if: ${{ inputs.correr_extraccion }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
            any::haven
      - name: Extraer los 5 datasets reales
        run: Rscript R/01_extract_real_subscales.R
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-processed
          path: data/processed/*.csv

  bloque-real-categorias:
    if: ${{ inputs.correr_bloque_real }}
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        dataset:
          - rse_k4.csv
          - mach_k5.csv
          - sps_k6.csv
          - hexaco_k7.csv
          - ahs_k8.csv
          - rwas_k9.csv
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - uses: actions/download-artifact@v4
        with:
          # run-id fijo: no depende de correr_extraccion en el mismo
          # dispatch -- descarga el artifact de la ultima corrida de
          # extract-real-data ya validada (incluye los 6 datasets, SPS-10 y
          # AHS incluidos). Si ese artifact expira, o si se agrega/cambia
          # algun dataset, correr una vez con correr_extraccion=true y
          # actualizar el run-id de abajo con el ID de la corrida nueva --
          # ver notes/DESIGN.md.
          name: real-data-processed
          path: data/processed
          run-id: 36119256254
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bloque real -- submuestreo m-out-of-N (R=10000)
        # ahs_k8 (N=1.036) no alcanza el maximo de la grilla comun (1500) --
        # usa una grilla reducida solo para este dataset, ver
        # R/02_bloque_real_categorias.R.
        run: |
          if [ "${{ matrix.dataset }}" = "ahs_k8.csv" ]; then
            Rscript R/02_bloque_real_categorias.R ${{ matrix.dataset }} 10000 10,25,50,100,250,500,1000
          else
            Rscript R/02_bloque_real_categorias.R ${{ matrix.dataset }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bloque-real-${{ matrix.dataset }}
          path: data/results/bloque_real_*.csv

  aggregate-results:
    if: ${{ inputs.correr_agregacion }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
      - name: Agregar los 5 datasets
        run: Rscript R/99_aggregate_results.R
      - uses: actions/upload-artifact@v4
        with:
          name: consolidado
          path: data/results/consolidado.csv

  calibrate-niveles:
    if: ${{ inputs.correr_calibracion_niveles }}
    strategy:
      matrix:
        nivel:
          - bajo
          - bajo_moderado
          - moderado
          - alto
          - muy_alto
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
      - name: Calibrar nivel (lambda + umbrales, Nelder-Mead)
        # n_starts=16 (default del script es 8) -- los niveles recalibrados
        # a percentiles de Cain et al. (25 sep 2026, ver notes/DESIGN.md
        # Seccion 16) son mas extremos que los originales, en particular
        # muy_alto (curtosis objetivo=9.48); una prueba local con 4 arranques
        # no convergio bien (dist2=0.174), se duplican los arranques para
        # compensar.
        run: Rscript R/03_calibrar_niveles.R ${{ matrix.nivel }} "" 16
      - uses: actions/upload-artifact@v4
        with:
          name: calibracion-nivel-${{ matrix.nivel }}
          path: data/results/calibracion_nivel_${{ matrix.nivel }}.csv

  consolidate-calibracion-niveles:
    if: ${{ inputs.correr_consolidar_calibracion_niveles }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
      - uses: actions/download-artifact@v4
        with:
          # run-id fijo, no needs: -- mismo motivo que bloque-real-categorias
          # arriba (no depende de correr_calibracion_niveles en el mismo
          # dispatch). Apunta a la corrida de calibrate-niveles ya validada
          # (36229461732, muy_alto corregido al percentil 90 -- ver
          # notes/DESIGN.md Seccion 17 -- dist2 maxima 0.0003 en las 35
          # celdas, sin degeneracion). Si ese artifact expira, correr una vez
          # con correr_calibracion_niveles=true y actualizar el run-id de
          # abajo.
          pattern: calibracion-nivel-*
          path: data/results
          merge-multiple: true
          run-id: 36229461732
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Consolidar los 5 niveles
        run: Rscript R/03b_consolidar_calibracion_niveles.R
      - uses: actions/upload-artifact@v4
        with:
          name: calibracion-niveles-consolidada
          path: data/results/calibracion_niveles.csv

  simulate-niveles:
    if: ${{ inputs.correr_simulacion_niveles }}
    strategy:
      matrix:
        nivel:
          - bajo
          - bajo_moderado
          - moderado
          - alto
          - muy_alto
        k: [3, 4, 5, 6, 7, 8, 9]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - name: Simulacion de niveles (R=10000)
        run: Rscript R/04_simulacion_niveles.R ${{ matrix.nivel }} ${{ matrix.k }}
      - uses: actions/upload-artifact@v4
        with:
          name: nivel-final-${{ matrix.nivel }}-k${{ matrix.k }}
          path: data/results/nivel_${{ matrix.nivel }}_k${{ matrix.k }}.csv

  calibrate-nivel-normal:
    if: ${{ inputs.correr_calibracion_normal }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
      - name: Calibrar nivel de referencia 'normal' (asimetria=0, curtosis=0)
        run: Rscript R/03_calibrar_niveles.R normal "" 16
      - uses: actions/upload-artifact@v4
        with:
          name: calibracion-nivel-normal
          path: data/results/calibracion_nivel_normal.csv

  simulate-nivel-normal:
    if: ${{ inputs.correr_simulacion_normal }}
    strategy:
      matrix:
        k: [3, 4, 5, 6, 7, 8, 9]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - name: Simulacion del nivel de referencia 'normal' (R=10000)
        # requiere data/results/calibracion_nivel_normal.csv ya commiteado
        # (ver job calibrate-nivel-normal) -- R/04_simulacion_niveles.R cae
        # a este archivo por nivel cuando el nivel no esta en el consolidado
        # de 35 celdas (ver el fallback agregado a ese script).
        run: Rscript R/04_simulacion_niveles.R normal ${{ matrix.k }}
      - uses: actions/upload-artifact@v4
        with:
          name: nivel-final-normal-k${{ matrix.k }}
          path: data/results/nivel_normal_k${{ matrix.k }}.csv

  calibrate-umbral-nulo:
    if: ${{ inputs.correr_calibracion_umbral_nulo }}
    strategy:
      matrix:
        k: [3, 4, 5, 6, 7, 8, 9]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - name: Calibrar umbral empirico p05 por prueba (R=10000)
        run: Rscript R/07_calibrar_umbral_nulo.R ${{ matrix.k }}
      - uses: actions/upload-artifact@v4
        with:
          name: umbral-nulo-k${{ matrix.k }}
          path: data/results/umbral_nulo_k${{ matrix.k }}.csv

  simulate-niveles-corregido:
    if: ${{ inputs.correr_simulacion_niveles_corregida }}
    strategy:
      matrix:
        nivel:
          - bajo
          - bajo_moderado
          - moderado
          - alto
          - muy_alto
        k: [3, 4, 5, 6, 7, 8, 9]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - name: Simulacion corregida de niveles (R=10000, umbral empirico)
        run: Rscript R/04b_simulacion_niveles_corregida.R ${{ matrix.nivel }} ${{ matrix.k }}
      - uses: actions/upload-artifact@v4
        with:
          name: nivel-corregido-${{ matrix.nivel }}-k${{ matrix.k }}
          path: data/results/nivel_${{ matrix.nivel }}_k${{ matrix.k }}_corregido.csv

  bloque-real-categorias-corregido:
    if: ${{ inputs.correr_bloque_real_corregido }}
    needs: extract-real-data
    strategy:
      matrix:
        dataset:
          - rse_k4.csv
          - mach_k5.csv
          - sps_k6.csv
          - hexaco_k7.csv
          - ahs_k8.csv
          - rwas_k9.csv
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - uses: actions/download-artifact@v4
        with:
          name: real-data-processed
          path: data/processed
      - name: Bloque real corregido -- submuestreo m-out-of-N (R=10000, umbral empirico)
        run: |
          if [ "${{ matrix.dataset }}" = "ahs_k8.csv" ]; then
            Rscript R/02b_bloque_real_categorias_corregida.R ${{ matrix.dataset }} 10000 10,25,50,100,250,500,1000
          else
            Rscript R/02b_bloque_real_categorias_corregida.R ${{ matrix.dataset }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bloque-real-corregido-${{ matrix.dataset }}
          path: data/results/bloque_real_*_corregido.csv

  extract-real-data-pais:
    if: ${{ inputs.correr_extraccion_pais }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - name: Extraer y separar EE.UU. vs. resto (5 instrumentos, sin AHS)
        run: Rscript R/01b_extract_real_subscales_pais.R
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-processed-pais
          path: |
            data/processed/*_us.csv
            data/processed/*_nous.csv

  bloque-real-categorias-pais:
    if: ${{ inputs.correr_bloque_real_pais }}
    needs: extract-real-data-pais
    strategy:
      matrix:
        dataset:
          - rse_k4_us.csv
          - rse_k4_nous.csv
          - mach_k5_us.csv
          - mach_k5_nous.csv
          - hexaco_k7_us.csv
          - hexaco_k7_nous.csv
          - sps_k6_us.csv
          - sps_k6_nous.csv
          - rwas_k9_us.csv
          - rwas_k9_nous.csv
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - uses: actions/download-artifact@v4
        with:
          name: real-data-processed-pais
          path: data/processed
      - name: Bloque real por pais -- submuestreo m-out-of-N (R=10000, grilla reducida n=10,25,50,100,250)
        run: Rscript R/02_bloque_real_categorias.R ${{ matrix.dataset }} 10000 10,25,50,100,250
      - uses: actions/upload-artifact@v4
        with:
          name: bloque-real-pais-${{ matrix.dataset }}
          path: data/results/bloque_real_*.csv

  aggregate-results-pais:
    if: ${{ inputs.correr_agregacion_pais }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tidyr
      # Mismo criterio que aggregate-results: los 10 CSV de
      # bloque-real-categorias-pais se descargan manualmente y se commitean a
      # data/results/ antes de correr este job (no via download-artifact) --
      # ver los bloque_real_*.csv ya trackeados en el repo como precedente.
      - name: Agregar los 10 archivos del chequeo por pais
        run: Rscript R/99b_aggregate_results_pais.R
      - uses: actions/upload-artifact@v4
        with:
          name: consolidado-pais
          path: |
            data/results/consolidado_pais.csv
            data/results/comparacion_n250.csv
            data/results/brecha_n250_detalle.csv
            data/results/brecha_n250.csv
            data/results/pruebas_estadisticas_n250.csv
            data/results/anova_grupos_n250.csv

  extract-real-data-sexo:
    if: ${{ inputs.correr_extraccion_sexo }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
            any::haven
      - name: Extraer y separar hombres vs. mujeres (5 instrumentos, sin HEXACO)
        run: Rscript R/01c_extract_real_subscales_sexo.R
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-processed-sexo
          path: |
            data/processed/*_hombres.csv
            data/processed/*_mujeres.csv

  bloque-real-categorias-sexo:
    if: ${{ inputs.correr_bloque_real_sexo }}
    needs: extract-real-data-sexo
    strategy:
      matrix:
        dataset:
          - rse_k4_hombres.csv
          - rse_k4_mujeres.csv
          - mach_k5_hombres.csv
          - mach_k5_mujeres.csv
          - sps_k6_hombres.csv
          - sps_k6_mujeres.csv
          - rwas_k9_hombres.csv
          - rwas_k9_mujeres.csv
          - ahs_k8_hombres.csv
          - ahs_k8_mujeres.csv
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - uses: actions/download-artifact@v4
        with:
          name: real-data-processed-sexo
          path: data/processed
      - name: Bloque real por sexo -- submuestreo m-out-of-N (R=10000, grilla reducida n=10,25,50,100,250)
        run: Rscript R/02_bloque_real_categorias.R ${{ matrix.dataset }} 10000 10,25,50,100,250
      - uses: actions/upload-artifact@v4
        with:
          name: bloque-real-sexo-${{ matrix.dataset }}
          path: data/results/bloque_real_*.csv

  aggregate-results-sexo:
    if: ${{ inputs.correr_agregacion_sexo }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tidyr
      # Mismo criterio que aggregate-results-pais: los 10 CSV de
      # bloque-real-categorias-sexo se descargan manualmente y se commitean a
      # data/results/ antes de correr este job.
      - name: Agregar los 10 archivos del chequeo por sexo
        run: Rscript R/99c_aggregate_results_sexo.R
      - uses: actions/upload-artifact@v4
        with:
          name: consolidado-sexo
          path: |
            data/results/consolidado_sexo.csv
            data/results/comparacion_sexo_n250.csv
            data/results/brecha_sexo_n250_detalle.csv
            data/results/brecha_sexo_n250.csv
            data/results/pruebas_estadisticas_sexo_n250.csv
            data/results/anova_grupos_sexo_n250.csv

  calibrate-umbral-nulo-m-instrumento:
    # Chequeo de robustez: el umbral de referencia usado para corregir el
    # bloque real (bloque-real-categorias-corregido arriba) se calibra con
    # m=10 fijo (mismo m que el bloque de niveles), pero MACH-IV (20 items),
    # AHS (8) y RWAS (22) no tienen m=10 -- ver R/07_calibrar_umbral_nulo.R
    # y notes/prompt_revision_julius_v3.md / v4.md. Este job recalibra la
    # celda de referencia 'normal' y el umbral empirico p05 con el m nativo
    # de cada uno de esos tres instrumentos, para comparar contra el umbral
    # generico ya usado.
    if: ${{ inputs.correr_calibracion_umbral_nulo_m_instrumento }}
    strategy:
      matrix:
        include:
          - instrumento: mach
            k: 5
            m: 20
          - instrumento: ahs
            k: 8
            m: 8
          - instrumento: rwas
            k: 9
            m: 22
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - name: Calibrar celda de referencia 'normal' con el m nativo del instrumento
        run: Rscript R/03_calibrar_niveles.R normal ${{ matrix.k }} 16 ${{ matrix.m }}
      - name: Calibrar umbral empirico p05 con ese m (R=10000)
        run: Rscript R/07_calibrar_umbral_nulo.R ${{ matrix.k }} "" "" ${{ matrix.m }}
      - uses: actions/upload-artifact@v4
        with:
          name: umbral-nulo-m-${{ matrix.instrumento }}
          path: |
            data/results/calibracion_nivel_normal_m${{ matrix.m }}.csv
            data/results/umbral_nulo_k${{ matrix.k }}_m${{ matrix.m }}.csv

  bloque-real-categorias-corregido-m-instrumento:
    # Repite el bloque real corregido de MACH-IV/AHS/RWAS con su umbral
    # m-especifico (job calibrate-umbral-nulo-m-instrumento, arriba) en vez
    # del umbral generico m=10, como chequeo de robustez -- no reemplaza
    # bloque-real-categorias-corregido, se guarda aparte (sufijo _m<m>) para
    # comparar ambos. Los umbral_nulo_k<k>_m<m>.csv ya estan commiteados en
    # el repo (no se descargan como artifact), asi que este job NO depende
    # de calibrate-umbral-nulo-m-instrumento en el mismo despacho -- solo de
    # extract-real-data, para tener los datasets reales frescos.
    if: ${{ inputs.correr_bloque_real_corregido_m_instrumento }}
    needs: extract-real-data
    strategy:
      matrix:
        include:
          - dataset: mach_k5.csv
            m: 20
          - dataset: ahs_k8.csv
            m: 8
          - dataset: rwas_k9.csv
            m: 22
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - uses: actions/download-artifact@v4
        with:
          name: real-data-processed
          path: data/processed
      - name: Bloque real corregido con umbral m-especifico (R=10000)
        run: |
          if [ "${{ matrix.dataset }}" = "ahs_k8.csv" ]; then
            Rscript R/02b_bloque_real_categorias_corregida.R ${{ matrix.dataset }} 10000 10,25,50,100,250,500,1000 ${{ matrix.m }}
          else
            Rscript R/02b_bloque_real_categorias_corregida.R ${{ matrix.dataset }} 10000 "" ${{ matrix.m }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bloque-real-corregido-m-${{ matrix.dataset }}
          path: data/results/bloque_real_*_corregido_m*.csv

  bloque-real-categorias-pais-corregido:
    # Exploratorio: aplica el umbral corregido (m generico o m-especifico
    # segun el instrumento) al chequeo de heterogeneidad por pais, que hasta
    # ahora solo se habia reportado con potencia nominal (ver Discusion del
    # manuscrito). No implica todavia ningun cambio al texto -- solo
    # generar los datos para decidir si vale la pena reportarlo.
    if: ${{ inputs.correr_bloque_real_pais_corregido }}
    needs: extract-real-data-pais
    strategy:
      matrix:
        include:
          - dataset: rse_k4_us.csv
            m: 10
          - dataset: rse_k4_nous.csv
            m: 10
          - dataset: mach_k5_us.csv
            m: 20
          - dataset: mach_k5_nous.csv
            m: 20
          - dataset: hexaco_k7_us.csv
            m: 10
          - dataset: hexaco_k7_nous.csv
            m: 10
          - dataset: sps_k6_us.csv
            m: 10
          - dataset: sps_k6_nous.csv
            m: 10
          - dataset: rwas_k9_us.csv
            m: 22
          - dataset: rwas_k9_nous.csv
            m: 22
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
