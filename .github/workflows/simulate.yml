    if: ${{ inputs.correr_bloque_real_sexo_corregido }}
    needs: extract-real-data-sexo
    strategy:
      matrix:
        include:
          - dataset: rse_k4_hombres.csv
            m: 10
          - dataset: rse_k4_mujeres.csv
            m: 10
          - dataset: mach_k5_hombres.csv
            m: 20
          - dataset: mach_k5_mujeres.csv
            m: 20
          - dataset: sps_k6_hombres.csv
            m: 10
          - dataset: sps_k6_mujeres.csv
            m: 10
          - dataset: rwas_k9_hombres.csv
            m: 22
          - dataset: rwas_k9_mujeres.csv
            m: 22
          - dataset: ahs_k8_hombres.csv
            m: 8
          - dataset: ahs_k8_mujeres.csv
            m: 8
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
