# Workflow de simulacion/submuestreo de este proyecto (ver notes/DESIGN.md).
# Mismo criterio que SSTN-Normality-Study: nada se corre localmente, toda
# corrida real (extraccion de datos reales, submuestreo, bateria de 11
# pruebas) pasa por GitHub Actions -- ver restriccion de integridad de
# investigacion en notes/DESIGN.md.

name: Bloque real de categorias

run-name: >-
  Bloque real:
  ${{ inputs.correr_extraccion && 'Extraccion de datos reales ' || '' }}${{ inputs.correr_bloque_real && 'Submuestreo real (4 datasets, k=4,5,7,9) ' || '' }}${{ inputs.correr_agregacion && 'Agregacion ' || '' }}${{ inputs.correr_calibracion_niveles && 'Calibracion de niveles (5 niveles x k=3..9) ' || '' }}${{ inputs.correr_simulacion_niveles && 'Simulacion de niveles (35 shards) ' || '' }}

on:
  workflow_dispatch:
    inputs:
      correr_extraccion:
        description: "Extrae los 4 datasets reales (RSE k=4, MACH-IV k=5, HEXACO k=7, RWAS k=9) desde data/raw/ -- correr esto primero"
        type: boolean
        default: false
      correr_bloque_real:
        description: "Submuestreo m-out-of-N sobre los 4 datasets reales (R=10000, grid n identico al Bloque 5 simulado de SSTN-Normality-Study) -- requiere que correr_extraccion ya se haya corrido y su artifact este disponible"
        type: boolean
        default: false
      correr_agregacion:
        description: "Agrega los 4 CSV finales del bloque real en un consolidado"
        type: boolean
        default: false
      correr_calibracion_niveles:
        description: "Calibra lambda + umbrales (libre, no fijo) para 5 niveles de asimetria/curtosis x k=3..9 (ver R/03_calibrar_niveles.R y notes/DESIGN.md) -- correr esto antes de correr_consolidar_calibracion_niveles"
        type: boolean
        default: false
      correr_consolidar_calibracion_niveles:
        description: "Concatena los 5 CSV de calibracion de niveles en uno solo (data/results/calibracion_niveles.csv) -- requiere que correr_calibracion_niveles ya se haya corrido"
        type: boolean
        default: false
      correr_simulacion_niveles:
        description: "Simulacion completa (R=10000) de los 5 niveles x k=3..9 = 35 shards -- requiere que calibracion_niveles.csv ya este commiteado en el repo"
        type: boolean
        default: false

jobs:
  extract-real-data:
    if: ${{ inputs.correr_extraccion }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - name: Extraer los 4 datasets reales
        run: Rscript R/01_extract_real_subscales.R
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-processed
          path: data/processed/*.csv

  bloque-real-categorias:
    if: ${{ inputs.correr_bloque_real }}
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        dataset:
          - rse_k4.csv
          - mach_k5.csv
          - hexaco_k7.csv
          - rwas_k9.csv
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - uses: actions/download-artifact@v4
        with:
          # run-id fijo: no depende de correr_extraccion en el mismo
          # dispatch (mismo criterio que simulate-plasmode en
          # SSTN-Normality-Study) -- descarga el artifact de la ultima
          # corrida de extract-real-data ya validada (35741701301). Si ese
          # artifact expira, correr una vez con correr_extraccion=true y
          # actualizar el run-id de abajo con el ID de la corrida nueva.
          name: real-data-processed
          path: data/processed
          run-id: 35741701301
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bloque real -- submuestreo m-out-of-N (R=10000)
        run: Rscript R/02_bloque_real_categorias.R ${{ matrix.dataset }}
      - uses: actions/upload-artifact@v4
        with:
          name: bloque-real-${{ matrix.dataset }}
          path: data/results/bloque_real_*.csv

  aggregate-results:
    if: ${{ inputs.correr_agregacion }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
      - name: Agregar los 4 datasets
        run: Rscript R/99_aggregate_results.R
      - uses: actions/upload-artifact@v4
        with:
          name: consolidado
          path: data/results/consolidado.csv

  calibrate-niveles:
    if: ${{ inputs.correr_calibracion_niveles }}
    strategy:
      matrix:
        nivel:
          - bajo
          - bajo_moderado
          - moderado
          - alto
          - muy_alto
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
      - name: Calibrar nivel (lambda + umbrales, Nelder-Mead)
        run: Rscript R/03_calibrar_niveles.R ${{ matrix.nivel }}
      - uses: actions/upload-artifact@v4
        with:
          name: calibracion-nivel-${{ matrix.nivel }}
          path: data/results/calibracion_nivel_${{ matrix.nivel }}.csv

  consolidate-calibracion-niveles:
    if: ${{ inputs.correr_consolidar_calibracion_niveles }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
      - uses: actions/download-artifact@v4
        with:
          # run-id fijo, no needs: -- mismo motivo que bloque-real-categorias
          # arriba (no depende de correr_calibracion_niveles en el mismo
          # dispatch). Apunta a la corrida de calibrate-niveles ya validada
          # (35749127861, las 5 celdas con dist2 <= 1e-11). Si ese artifact
          # expira, correr una vez con correr_calibracion_niveles=true y
          # actualizar el run-id de abajo.
          pattern: calibracion-nivel-*
          path: data/results
          merge-multiple: true
          run-id: 35749127861
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Consolidar los 5 niveles
        run: Rscript R/03b_consolidar_calibracion_niveles.R
      - uses: actions/upload-artifact@v4
        with:
          name: calibracion-niveles-consolidada
          path: data/results/calibracion_niveles.csv

  simulate-niveles:
    if: ${{ inputs.correr_simulacion_niveles }}
    strategy:
      matrix:
        nivel:
          - bajo
          - bajo_moderado
          - moderado
          - alto
          - muy_alto
        k: [3, 4, 5, 6, 7, 8, 9]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::dplyr
            any::purrr
            any::tidyr
            any::readr
      - name: Simulacion de niveles (R=10000)
        run: Rscript R/04_simulacion_niveles.R ${{ matrix.nivel }} ${{ matrix.k }}
      - uses: actions/upload-artifact@v4
        with:
          name: nivel-final-${{ matrix.nivel }}-k${{ matrix.k }}
          path: data/results/nivel_${{ matrix.nivel }}_k${{ matrix.k }}.csv
