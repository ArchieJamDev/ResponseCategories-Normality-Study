<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="620" fill="white"/>

  <!-- ============ PANEL A: mecanismo generativo ============ -->
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#000">A. Mecanismo generativo (una celda: un nivel de severidad × un valor de k)</text>

  <!-- theta node -->
  <circle cx="90" cy="130" r="42" fill="none" stroke="#000" stroke-width="1.8"/>
  <text x="90" y="124" font-size="15" text-anchor="middle" fill="#000">&#952; ~ N(0,1)</text>
  <text x="90" y="142" font-size="11" text-anchor="middle" fill="#333">factor común</text>

  <!-- arrows from theta to 3 sample items -->
  <line x1="130" y1="115" x2="230" y2="80"  stroke="#000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="130" y1="130" x2="230" y2="150" stroke="#000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="130" y1="150" x2="230" y2="230" stroke="#000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="168" y="90"  font-size="12" fill="#000">&#955;</text>
  <text x="168" y="150" font-size="12" fill="#000">&#955;</text>
  <text x="168" y="205" font-size="12" fill="#000">&#955;</text>

  <!-- epsilon nodes for 3 items -->
  <circle cx="230" cy="45" r="20" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="230" y="49" font-size="9.5" text-anchor="middle" fill="#555">&#949;&#8321;</text>
  <line x1="245" y1="60" x2="255" y2="75" stroke="#666" stroke-width="1.1" marker-end="url(#arrowgray)"/>
  <text x="260" y="65" font-size="10" fill="#555">&#8730;(1&#8722;&#955;&#178;)</text>

  <circle cx="230" cy="185" r="20" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="230" y="189" font-size="9.5" text-anchor="middle" fill="#555">&#949;&#8322;</text>
  <line x1="245" y1="170" x2="255" y2="155" stroke="#666" stroke-width="1.1" marker-end="url(#arrowgray)"/>
  <text x="260" y="167" font-size="10" fill="#555">&#8730;(1&#8722;&#955;&#178;)</text>

  <text x="230" y="270" font-size="14" text-anchor="middle" fill="#000">&#8942;</text>
  <circle cx="230" cy="300" r="20" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="230" y="304" font-size="9.5" text-anchor="middle" fill="#555">&#949;<tspan font-size="7">m</tspan></text>
  <line x1="245" y1="285" x2="255" y2="255" stroke="#666" stroke-width="1.1" marker-end="url(#arrowgray)"/>
  <text x="262" y="270" font-size="10" fill="#555">&#8730;(1&#8722;&#955;&#178;)</text>

  <!-- item boxes -->
  <rect x="270" y="65"  width="90" height="30" rx="4" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="315" y="85" font-size="12" text-anchor="middle" fill="#000">ítem&#8321;</text>
  <rect x="270" y="135" width="90" height="30" rx="4" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="315" y="155" font-size="12" text-anchor="middle" fill="#000">ítem&#8322;</text>
  <rect x="270" y="285" width="90" height="30" rx="4" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="315" y="305" font-size="12" text-anchor="middle" fill="#000">ítem<tspan font-size="9">m</tspan></text>

  <!-- discretization: bell curve with thresholds, for item1 as example -->
  <text x="410" y="45" font-size="11" fill="#000">discretización (k&#8722;1 umbrales)</text>
  <g transform="translate(400,50)">
    <path d="M 0,60 C 15,60 25,0 60,0 C 95,0 105,60 120,60" fill="none" stroke="#000" stroke-width="1.4"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#000" stroke-width="1"/>
    <!-- thresholds (asymmetric, shown shifted right to illustrate a skewed calibration) -->
    <line x1="40" y1="0" x2="40" y2="62" stroke="#000" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="65" y1="0" x2="65" y2="62" stroke="#000" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="85" y1="0" x2="85" y2="62" stroke="#000" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="18" y="76" font-size="9" fill="#333" text-anchor="middle">1</text>
    <text x="52" y="76" font-size="9" fill="#333" text-anchor="middle">2</text>
    <text x="75" y="76" font-size="9" fill="#333" text-anchor="middle">3</text>
    <text x="102" y="76" font-size="9" fill="#333" text-anchor="middle">k</text>
  </g>
  <line x1="360" y1="80" x2="398" y2="80" stroke="#000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- sum -->
  <line x1="360" y1="150" x2="600" y2="280" stroke="#999" stroke-width="1" stroke-dasharray="1,3"/>
  <line x1="460" y1="90" x2="600" y2="280" stroke="#999" stroke-width="1" stroke-dasharray="1,3"/>
  <line x1="360" y1="300" x2="600" y2="285" stroke="#999" stroke-width="1" stroke-dasharray="1,3"/>
  <circle cx="620" cy="290" r="26" fill="none" stroke="#000" stroke-width="1.8"/>
  <text x="620" y="298" font-size="20" text-anchor="middle" fill="#000">&#931;</text>

  <line x1="646" y1="285" x2="700" y2="270" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="705" y="240" width="120" height="60" rx="5" fill="none" stroke="#000" stroke-width="1.8"/>
  <text x="765" y="266" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Puntaje</text>
  <text x="765" y="284" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">compuesto S</text>

  <!-- formula box -->
  <rect x="20" y="350" width="920" height="66" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
  <text x="35" y="374" font-size="13" fill="#000" font-family="Georgia, 'Times New Roman', serif">ítem_j = &#955;&#183;&#952; + &#8730;(1&#8722;&#955;&#178;)&#183;&#949;_j &#160;&#160;&#160;&#160;&#160;&#160; umbral_j = p + &#931;exp(g_i) &#160;&#160;&#160;&#160;&#160;&#160; &#955; = 1 / (1 + e&#8315;&#7488;)</text>
  <text x="35" y="398" font-size="12.5" fill="#333" font-family="Georgia, 'Times New Roman', serif">&#955; y los umbrales se calibran JUNTOS (Nelder-Mead) para alcanzar un objetivo de (asimetría, curtosis) — no solo los umbrales, a diferencia del diseño con &#955; fija</text>

  <!-- ============ PANEL B: lambda fija vs libre ============ -->
  <text x="20" y="448" font-size="16" font-weight="bold" fill="#000">B. Por qué &#955; libre importa: espacio de (asimetría, curtosis) alcanzable</text>

  <!-- left: lambda fixed -->
  <text x="230" y="472" font-size="13" text-anchor="middle" fill="#000">&#955; fija (p.ej. 0.8) + umbrales calibrados</text>
  <g transform="translate(120,485)">
    <line x1="0" y1="100" x2="220" y2="100" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="100" x2="0" y2="0" stroke="#000" stroke-width="1"/>
    <text x="-8" y="10" font-size="9" text-anchor="end" fill="#333">curtosis +</text>
    <text x="-8" y="98" font-size="9" text-anchor="end" fill="#333">curtosis &#8722;</text>
    <text x="215" y="115" font-size="9" text-anchor="end" fill="#333">asimetría</text>
    <!-- reachable region: small band, all below zero kurtosis -->
    <ellipse cx="110" cy="78" rx="95" ry="14" fill="#ddd" stroke="#888" stroke-width="1"/>
    <text x="110" y="82" font-size="9.5" text-anchor="middle" fill="#333">región alcanzada: siempre platicúrtica</text>
    <line x1="0" y1="55" x2="220" y2="55" stroke="#000" stroke-width="0.7" stroke-dasharray="2,2"/>
    <text x="225" y="58" font-size="8" fill="#666">curtosis=0</text>
    <!-- RWAS target marker, unreachable -->
    <circle cx="185" cy="15" r="4" fill="#000"/>
    <text x="185" y="8" font-size="9" text-anchor="middle" fill="#000">RWAS (objetivo)</text>
    <line x1="185" y1="19" x2="185" y2="60" stroke="#000" stroke-width="0.8" stroke-dasharray="1,2"/>
    <text x="185" y="130" font-size="9" text-anchor="middle" fill="#c00">&#10007; fuera de alcance</text>
  </g>

  <!-- right: lambda free -->
  <text x="740" y="472" font-size="13" text-anchor="middle" fill="#000">&#955; libre + umbrales calibrados juntos</text>
  <g transform="translate(630,485)">
    <line x1="0" y1="100" x2="220" y2="100" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="100" x2="0" y2="0" stroke="#000" stroke-width="1"/>
    <text x="-8" y="10" font-size="9" text-anchor="end" fill="#333">curtosis +</text>
    <text x="-8" y="98" font-size="9" text-anchor="end" fill="#333">curtosis &#8722;</text>
    <text x="215" y="115" font-size="9" text-anchor="end" fill="#333">asimetría</text>
    <!-- reachable region: much larger, spans positive kurtosis -->
    <ellipse cx="120" cy="55" rx="105" ry="52" fill="#ddd" stroke="#888" stroke-width="1"/>
    <text x="120" y="100" font-size="9.5" text-anchor="middle" fill="#333" dy="-2">región alcanzada: incluye leptocúrtica</text>
    <line x1="0" y1="55" x2="220" y2="55" stroke="#000" stroke-width="0.7" stroke-dasharray="2,2"/>
    <text x="225" y="58" font-size="8" fill="#666">curtosis=0</text>
    <circle cx="185" cy="15" r="4" fill="#000"/>
    <text x="185" y="8" font-size="9" text-anchor="middle" fill="#000">RWAS (objetivo)</text>
    <text x="185" y="130" font-size="9" text-anchor="middle" fill="#080">&#10003; d&#178; &#8776; 10&#8315;&#185;&#185;</text>
  </g>

  <!-- arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#000"/>
    </marker>
    <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
